[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unif-scan-skillfortify"
version = "0.1.0"
description = "Static security analyzer for AI agent skills - part of the unified scanner framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "SkillFortify Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "security",
    "scanner",
    "agent",
    "skills",
    "static-analysis",
    "ai-security",
]

dependencies = [
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/anthropics/scan-skillfortify"
Repository = "https://github.com/anthropics/scan-skillfortify"

[tool.hatch.build.targets.wheel]
packages = ["scan_skillfortify"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
